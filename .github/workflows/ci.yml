name: Quality

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run qa
            - run: npm run itch:package
            - uses: actions/upload-artifact@v4
              with:
                  name: itch-build
                  path: itch/output/*-itch.zip
