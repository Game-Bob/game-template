name: Release npm package

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Validate only or publish the current package version
                required: true
                default: dry-run
                type: choice
                options:
                    - dry-run
                    - publish
    push:
        tags:
            - "v*"

concurrency:
    group: game-template-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - name: Validate project
              run: npm run qa

            - name: Build itch.io bundle
              run: npm run itch:package

            - name: Build Electron installer
              run: npm run electron:dist

            - name: Read package metadata
              id: package
              shell: bash
              run: |
                  name=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json")).name)')
                  version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json")).version)')
                  echo "name=$name" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Inspect npm package
              if: inputs.mode == 'dry-run'
              run: npm publish --access public --dry-run

            - name: Check registry version
              if: inputs.mode == 'publish' || github.event_name == 'push'
              id: registry
              shell: bash
              run: |
                  if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version > /dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish npm package
              if: (inputs.mode == 'publish' || github.event_name == 'push') && steps.registry.outputs.published != 'true'
              shell: bash
              run: |
                  set +e
                  output=$(npm publish --access public 2>&1)
                  status=$?
                  printf '%s\n' "$output"
                  if [[ "$status" -eq 0 || "$output" == *"previously published versions"* ]]; then
                    exit 0
                  fi
                  exit "$status"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Ensure npm package is public
              if: inputs.mode == 'publish' || github.event_name == 'push'
              run: npm access set status=public "${{ steps.package.outputs.name }}"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Verify public npm publication
              if: inputs.mode == 'publish' || github.event_name == 'push'
              shell: bash
              run: |
                  for attempt in 1 2 3 4 5; do
                    if NPM_CONFIG_USERCONFIG=/dev/null npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version > /dev/null 2>&1; then
                      exit 0
                    fi
                    sleep 10
                  done
                  echo "The package is not publicly visible in npm after publication."
                  exit 1

            - name: Create GitHub release and upload artifacts
              if: inputs.mode == 'publish' || github.event_name == 'push'
              shell: bash
              run: |
                  tag="v${{ steps.package.outputs.version }}"
                  if gh release view "$tag" > /dev/null 2>&1; then
                    echo "GitHub release $tag already exists"
                  else
                    gh release create "$tag" --target "$GITHUB_SHA" --title "${{ steps.package.outputs.name }} $tag" --generate-notes
                  fi
                  mapfile -t assets < <(find itch/output release -maxdepth 1 -type f 2>/dev/null | sort)
                  if ((${#assets[@]} > 0)); then
                    gh release upload "$tag" "${assets[@]}" --clobber
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
