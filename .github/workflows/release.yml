name: Release npm package

on:
    workflow_dispatch:
        inputs:
            mode:
                description: Validate only or publish the current package version
                required: true
                default: dry-run
                type: choice
                options:
                    - dry-run
                    - publish
    push:
        tags:
            - "v*"

concurrency:
    group: game-template-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: npm
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: npm ci

            - name: Validate project
              run: npm run qa

            - name: Build itch.io bundle
              run: npm run itch:package

            - name: Build Electron installer
              run: npm run electron:dist

            - name: Read package metadata
              id: package
              shell: bash
              run: |
                  echo "name=$(node -p \"require('./package.json').name\")" >> "$GITHUB_OUTPUT"
                  echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

            - name: Inspect npm package
              if: inputs.mode == 'dry-run'
              run: npm publish --access public --dry-run

            - name: Check registry version
              if: inputs.mode == 'publish' || github.event_name == 'push'
              id: registry
              shell: bash
              run: |
                  if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version > /dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish npm package
              if: (inputs.mode == 'publish' || github.event_name == 'push') && steps.registry.outputs.published != 'true'
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create GitHub release and upload artifacts
              if: inputs.mode == 'publish' || github.event_name == 'push'
              shell: bash
              run: |
                  tag="v${{ steps.package.outputs.version }}"
                  if gh release view "$tag" > /dev/null 2>&1; then
                    echo "GitHub release $tag already exists"
                  else
                    gh release create "$tag" --target "$GITHUB_SHA" --title "${{ steps.package.outputs.name }} $tag" --generate-notes
                  fi
                  mapfile -t assets < <(find itch/output release -maxdepth 1 -type f 2>/dev/null | sort)
                  if ((${#assets[@]} > 0)); then
                    gh release upload "$tag" "${assets[@]}" --clobber
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
